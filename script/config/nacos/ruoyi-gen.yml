spring:
  datasource:
    dynamic:
      # 设置默认的数据源或者数据源组,默认值即为 master
      primary: master
      seata: false
      datasource:
        # 主库数据源 (主数据源内包含代码生成数据表 增加其他数据库不要修改主数据源 否则数据无法存储)
        master:
          type: ${spring.datasource.type}
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: ${datasource.system-master.url}
          username: ${datasource.system-master.username}
          password: ${datasource.system-master.password}
        # 竞价库（导入 bid_* 表时选此数据源）
        bidding:
          type: ${spring.datasource.type}
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: ${datasource.bidding.url}
          username: ${datasource.bidding.username}
          password: ${datasource.bidding.password}
        # 营销库（导入 pm_* 表时选此数据源）
        pm:
          type: ${spring.datasource.type}
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: ${datasource.pm.url}
          username: ${datasource.pm.username}
          password: ${datasource.pm.password}
        # 业务用户库（导入业务用户表时选此数据源，与 sys_user 无关）
        user:
          type: ${spring.datasource.type}
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: ${datasource.user.url}
          username: ${datasource.user.username}
          password: ${datasource.user.password}
        # 商品库（导入 goods_* 表时选此数据源）
        goods:
          type: ${spring.datasource.type}
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: ${datasource.goods.url}
          username: ${datasource.goods.username}
          password: ${datasource.goods.password}
        # 分销库（导入 dis_* 表时选此数据源）
        dis:
          type: ${spring.datasource.type}
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: ${datasource.dis.url}
          username: ${datasource.dis.username}
          password: ${datasource.dis.password}
        # 订单库（导入 order_* 表时选此数据源）
        order:
          type: ${spring.datasource.type}
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: ${datasource.order.url}
          username: ${datasource.order.username}
          password: ${datasource.order.password}
#        oracle:
#          type: ${spring.datasource.type}
#          driverClassName: oracle.jdbc.OracleDriver
#          url: ${datasource.system-oracle.url}
#          username: ${datasource.system-oracle.username}
#          password: ${datasource.system-oracle.password}
#        postgres:
#          type: ${spring.datasource.type}
#          driverClassName: org.postgresql.Driver
#          url: ${datasource.system-postgres.url}
#          username: ${datasource.system-postgres.username}
#          password: ${datasource.system-postgres.password}

# 代码生成
gen:
  # 作者
  author: LionLi
  # 默认生成包路径 system 需改成自己的模块名称 如 system monitor tool
  packageName: org.dromara.system
  # 自动去除表前缀，默认是false
  autoRemovePre: false
  # 表前缀（生成类名不会包含表前缀，多个用逗号分隔）
  tablePrefix: sys_
