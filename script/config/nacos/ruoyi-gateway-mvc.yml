# 安全配置
security:
  # 不校验白名单
  ignore:
    whites:
      - /auth/code
      - /auth/logout
      - /auth/login
      - /auth/binding/*
      - /auth/register
      - /auth/tenant/list
      - /resource/sms/code
      - /resource/sse/close
      - /*/v3/api-docs
      - /*/error
      - /csrf
      - /warm-flow-ui/**
      - /pay/wx/notify

spring:
  cloud:
    gateway:
      # 打印请求日志(自定义)
      requestLog: true
      server:
        webmvc:
          discovery:
            locator:
              lowerCaseServiceId: true
              enabled: true
          routes:
            # 认证中心
            - id: ruoyi-auth
              uri: lb://ruoyi-auth
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1
            # 代码生成
            - id: ruoyi-gen
              uri: lb://ruoyi-gen
              predicates:
                - Path=/tool/**
              filters:
                - StripPrefix=1
            # 系统模块
            - id: ruoyi-system
              uri: lb://ruoyi-system
              predicates:
                - Path=/system/**,/monitor/**
              filters:
                - StripPrefix=1
            # 资源服务
            - id: ruoyi-resource
              uri: lb://ruoyi-resource
              predicates:
                - Path=/resource/**
              filters:
                - StripPrefix=1
            # workflow服务
            - id: ruoyi-workflow
              uri: lb://ruoyi-workflow
              predicates:
                - Path=/workflow/**
              filters:
                - StripPrefix=1
            # 竞价中心服务
            - id: ruoyi-bidding
              uri: lb://ruoyi-bidding
              predicates:
                - Path=/bidding/**
              filters:
                - StripPrefix=1
            # 营销中心服务
            - id: ruoyi-pm
              uri: lb://ruoyi-pm
              predicates:
                - Path=/pm/**
              filters:
                - StripPrefix=1
            # 业务用户中心服务（与 system 系统用户无关）
            - id: ruoyi-user
              uri: lb://ruoyi-user
              predicates:
                - Path=/user/**
              filters:
                - StripPrefix=1
            # 商品中心服务
            - id: ruoyi-goods
              uri: lb://ruoyi-goods
              predicates:
                - Path=/goods/**
              filters:
                - StripPrefix=1
            # 分销中心服务
            - id: ruoyi-dis
              uri: lb://ruoyi-dis
              predicates:
                - Path=/dis/**
              filters:
                - StripPrefix=1
            # 订单中心服务
            - id: ruoyi-order
              uri: lb://ruoyi-order
              predicates:
                - Path=/order/**
              filters:
                - StripPrefix=1
            # 支付中心服务
            - id: ruoyi-pay
              uri: lb://ruoyi-pay
              predicates:
                - Path=/pay/**
              filters:
                - StripPrefix=1
            # warm-flow服务
            - id: warm-flow
              uri: lb://ruoyi-workflow
              predicates:
                - Path=/warm-flow-ui/**,/warm-flow/**
            # 演示服务
            - id: ruoyi-demo
              uri: lb://ruoyi-demo
              predicates:
                - Path=/demo/**
              filters:
                - StripPrefix=1
            # MQ演示服务
            - id: ruoyi-test-mq
              uri: lb://ruoyi-test-mq
              predicates:
                - Path=/test-mq/**
              filters:
                - StripPrefix=1
